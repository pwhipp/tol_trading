version: 1

broker:
  mode: paper
  execution:
    target_percent: 1%
    partials:
      buy: allow
      sell: allow
    max_duration: 4

settings:
  slippage: 0.005        # 0.5%
  rounding: FLOOR        # explicit policy

actions:
  - target:
      symbol: TSLA.NASDAQ
      percent: 10%
      using: [CASH (USD), NVDA.NASDAQ]
