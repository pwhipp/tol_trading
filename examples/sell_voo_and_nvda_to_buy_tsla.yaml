version: 1

broker:
  mode: paper
  execution:
    target_percent: 1%
    partials:
      buy: allow
      sell: allow
    max_duration: 4

settings:
  slippage: 0.005        # 0.5%
  rounding: FLOOR        # explicit policy

actions:
  - sell:
      symbol: VOO.NYSE
      quantity: 100

  - sell:
      symbol: NVDA.NASDAQ
      quantity: 100

  - buy:
      symbol: TSLA.NASDAQ
      using: [sellVOO.NYSE, sellNVDA.NASDAQ]
      quantity: ALL
