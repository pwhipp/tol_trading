[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "tol"
version = "0.1.0"
description = "Trading Orchestration Language CLI"
requires-python = ">=3.12"

dependencies = [
    "ib-insync>=0.9.86",
    "PyYAML>=6.0.2",
    "tzdata>=2025.3"
]

[project.scripts]
tol = "tol.cli.main:main"
